name: oracle

services:
  web:
    image: ghcr.io/${GHCR_OWNER}/oracle-web:latest
    env_file: .env
    restart: unless-stopped
    mem_limit: 350m
    networks:
      shared:
        aliases: [oracle-web]

  migrate:
    image: ghcr.io/${GHCR_OWNER}/oracle-migrate:latest
    env_file: .env
    profiles: ["tools"]
    mem_limit: 200m
    networks: [shared]

networks:
  shared:
    external: true
    name: food-tracker-bot_default
